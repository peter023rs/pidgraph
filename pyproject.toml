[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidgraph"
version = "0.1.0"
description = "Standalone P&ID digitization: scanned Sheets -> plant topology graph -> DEXPI JSON + Neo4j (s2_pml schema)."
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "flask>=3.0", "pymupdf>=1.24"]
neo4j = ["neo4j>=5.0"]
workbench = ["flask>=3.0"]
labelfactory = ["pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
